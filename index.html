<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Love ❤️</title>

<style>

/* =========================
   BASIC RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family: "Poppins", Arial, sans-serif;

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at 20% 20%, #ff4b91 0%, transparent 25%),
        radial-gradient(circle at 80% 80%, #8e44ff 0%, transparent 25%),
        radial-gradient(circle at 50% 50%, #36002e, #100016 70%);

    position: relative;
}


/* =========================
   ANIMATED BACKGROUND
========================= */

body::before {
    content: "";

    position: absolute;
    width: 600px;
    height: 600px;

    border-radius: 50%;

    background: rgba(255, 0, 128, 0.12);

    filter: blur(100px);

    animation: backgroundMove 8s infinite alternate ease-in-out;
}

@keyframes backgroundMove {

    0% {
        transform: translate(-200px, -100px);
    }

    100% {
        transform: translate(200px, 100px);
    }
}


/* =========================
   STARS
========================= */

.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    box-shadow: 0 0 10px white;

    animation: twinkle 2s infinite alternate;
}

.star:nth-child(1) {
    top: 15%;
    left: 10%;
}

.star:nth-child(2) {
    top: 30%;
    left: 80%;
    animation-delay: .5s;
}

.star:nth-child(3) {
    top: 70%;
    left: 20%;
    animation-delay: 1s;
}

.star:nth-child(4) {
    top: 20%;
    left: 60%;
    animation-delay: 1.5s;
}

.star:nth-child(5) {
    top: 80%;
    left: 85%;
    animation-delay: .8s;
}

.star:nth-child(6) {
    top: 60%;
    left: 70%;
    animation-delay: .3s;
}

@keyframes twinkle {

    from {
        opacity: .2;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* =========================
   MAIN CARD
========================= */

.card {

    width: min(900px, 92%);

    padding: 55px 35px;

    text-align: center;

    border-radius: 35px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.04)
        );

    border: 1px solid rgba(255,255,255,.25);

    backdrop-filter: blur(25px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.6),
        inset 0 0 50px rgba(255,255,255,.04);

    position: relative;

    z-index: 5;

    animation: cardAppear 1.5s ease;

}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: translateY(40px) scale(.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================
   HEART
========================= */

.big-heart {

    font-size: 75px;

    display: inline-block;

    filter:
        drop-shadow(0 0 10px #ff4b91)
        drop-shadow(0 0 30px #ff4b91);

    animation:
        heartbeat 1.1s infinite,
        heartGlow 2s infinite alternate;

}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    25% {
        transform: scale(1.12);
    }

    40% {
        transform: scale(1);
    }

    60% {
        transform: scale(1.2);
    }

}

@keyframes heartGlow {

    from {
        filter: drop-shadow(0 0 10px #ff4b91);
    }

    to {
        filter:
            drop-shadow(0 0 25px #ff4b91)
            drop-shadow(0 0 50px #ff007f);
    }

}


/* =========================
   TITLE
========================= */

h1 {

    margin-top: 15px;

    font-size: clamp(38px, 7vw, 72px);

    font-family: Georgia, serif;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff8fbd,
            #fff,
            #ff5c9d
        );

    background-size: 300%;

    -webkit-background-clip: text;

    color: transparent;

    animation: gradientText 5s infinite linear;

}

@keyframes gradientText {

    0% {
        background-position: 0%;
    }

    100% {
        background-position: 300%;
    }

}


.subtitle {

    margin-top: 12px;

    font-size: 18px;

    color: #ffd6e7;

    letter-spacing: 2px;

}

.date {

    margin-top: 20px;

    font-size: 20px;

    color: #ff9fc5;

    font-weight: bold;

}


/* =========================
   COUNTDOWN
========================= */

.countdown {

    margin-top: 40px;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;

}

.time-box {

    padding: 25px 10px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.03)
        );

    border: 1px solid rgba(255,255,255,.18);

    box-shadow:
        0 15px 35px rgba(0,0,0,.3),
        inset 0 0 20px rgba(255,80,150,.05);

    transition: .4s;

}

.time-box:hover {

    transform:
        translateY(-10px)
        scale(1.04);

    box-shadow:
        0 20px 50px rgba(255,50,140,.3);

}

.number {

    display: block;

    font-size: clamp(32px, 5vw, 60px);

    font-weight: bold;

    color: white;

    text-shadow:
        0 0 10px #ff4b91,
        0 0 25px #ff4b91,
        0 0 50px #ff007f;

}

.label {

    font-size: 12px;

    letter-spacing: 3px;

    color: #ffc8db;

    text-transform: uppercase;

}


/* =========================
   MESSAGE
========================= */

.message {

    margin-top: 35px;

    font-size: 17px;

    line-height: 1.8;

    color: #ffe8f1;

}

.signature {

    margin-top: 18px;

    font-family: cursive;

    font-size: 25px;

    color: #ff8fba;

}


/* =========================
   TAP EFFECT
========================= */

.tap-effect {

    position: fixed;

    pointer-events: none;

    z-index: 9999;

    font-size: 30px;

    transform: translate(-50%, -50%);

    animation: kissAnimation 1.5s ease-out forwards;

}

@keyframes kissAnimation {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.3)
            rotate(-10deg);

    }

    20% {

        opacity: 1;

        transform:
            translate(-50%, -70%)
            scale(1.3)
            rotate(5deg);

    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -180%)
            scale(1.8)
            rotate(20deg);

    }

}


/* =========================
   FLOWER PARTICLES
========================= */

.flower {

    position: fixed;

    pointer-events: none;

    z-index: 9998;

    font-size: 25px;

    animation:
        flowerFall 2s ease-out forwards;

}

@keyframes flowerFall {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            rotate(0deg)
            scale(.5);

    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(360deg)
            scale(1.3);

    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .card {

        padding: 40px 18px;

    }

    .big-heart {

        font-size: 55px;

    }

    .subtitle {

        font-size: 13px;

    }

    .date {

        font-size: 17px;

    }

    .countdown {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;

    }

    .time-box {

        padding: 20px 8px;

    }

    .message {

        font-size: 14px;

    }

}

</style>
</head>


<body>


<!-- STARS -->

<div class="stars">

    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>

</div>


<!-- MAIN CARD -->

<div class="card">

    <div class="big-heart">
        ❤️
    </div>


    <h1>
        Her Special Day
    </h1>


    <p class="subtitle">
        The countdown to the day When one angle came from Heaven in human form.....  ✨
    </p>


    <p class="date">
        💕 26 November 2026 💕
    </p>


    <!-- COUNTDOWN -->

    <div class="countdown">

        <div class="time-box">

            <span
                id="days"
                class="number">
                00
            </span>

            <span class="label">
                Days
            </span>

        </div>


        <div class="time-box">

            <span
                id="hours"
                class="number">
                00
            </span>

            <span class="label">
                Hours
            </span>

        </div>


        <div class="time-box">

            <span
                id="minutes"
                class="number">
                00
            </span>

            <span class="label">
                Minutes
            </span>

        </div>


        <div class="time-box">

            <span
                id="seconds"
                class="number">
                00
            </span>

            <span class="label">
                Seconds
            </span>

        </div>

    </div>


    <p class="message">

        Every second brings us closer to your special day. 💗
        <br>

        Until then, I'll keep counting every moment... 💋

    </p>


    <div class="signature">

        Made with infinite ❤️ just for you

    </div>

</div>



<script>

/* =========================================
   BIRTHDAY DATE
========================================= */

const birthday =
    new Date(
        "November 26, 2026 00:00:00"
    ).getTime();



/* =========================================
   COUNTDOWN
========================================= */

function updateCountdown() {

    const now =
        new Date().getTime();

    const difference =
        birthday - now;


    if (difference <= 0) {

        document.getElementById("days")
            .innerText = "00";

        document.getElementById("hours")
            .innerText = "00";

        document.getElementById("minutes")
            .innerText = "00";

        document.getElementById("seconds")
            .innerText = "00";


        document.querySelector("h1")
            .innerText =
            "Happy Birthday My Love ❤️";


        document.querySelector(".message")
            .innerHTML =
            "Today is your day! 🎂💖<br>" +
            "You deserve all the happiness in the world. 🌎❤️";

        return;

    }


    const days =
        Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (difference /
            (1000 * 60 * 60)) % 24
        );


    const minutes =
        Math.floor(
            (difference /
            (1000 * 60)) % 60
        );


    const seconds =
        Math.floor(
            (difference / 1000) % 60
        );


    document.getElementById("days")
        .innerText =
        String(days).padStart(2,"0");


    document.getElementById("hours")
        .innerText =
        String(hours).padStart(2,"0");


    document.getElementById("minutes")
        .innerText =
        String(minutes).padStart(2,"0");


    document.getElementById("seconds")
        .innerText =
        String(seconds).padStart(2,"0");

}


updateCountdown();

setInterval(
    updateCountdown,
    1000
);



/* =========================================
   💋 KISS + 🌸 FLOWER EFFECT
   ON EVERY TOUCH / CLICK
========================================= */

function loveEffect(x, y) {


    /* KISS */

    const kiss =
        document.createElement("div");

    kiss.className =
        "tap-effect";

    kiss.innerHTML =
        "💋";

    kiss.style.left =
        x + "px";

    kiss.style.top =
        y + "px";

    document.body.appendChild(kiss);


    setTimeout(() => {

        kiss.remove();

    },1500);



    /* FLOWERS */

    const flowers = [
        "🌸",
        "🌹",
        "🌷",
        "🌺",
        "🌼",
        "💐",
        "🌻"
    ];


    for(let i = 0; i < 7; i++) {

        const flower =
            document.createElement("div");

        flower.className =
            "flower";


        flower.innerHTML =
            flowers[
                Math.floor(
                    Math.random() *
                    flowers.length
                )
            ];


        flower.style.left =
            x + "px";

        flower.style.top =
            y + "px";


        const randomX =
            (Math.random() - .5) * 180;

        const randomY =
            -Math.random() * 180 - 30;


        flower.style.setProperty(
            "--x",
            randomX + "px"
        );


        flower.style.setProperty(
            "--y",
            randomY + "px"
        );


        document.body.appendChild(
            flower
        );


        setTimeout(() => {

            flower.remove();

        },2000);

    }

}



/* =========================================
   DESKTOP CLICK
========================================= */

document.addEventListener(
    "click",
    function(event) {

        loveEffect(
            event.clientX,
            event.clientY
        );

    }
);



/* =========================================
   MOBILE TOUCH
========================================= */

document.addEventListener(
    "touchstart",
    function(event) {

        const touch =
            event.touches[0];

        loveEffect(
            touch.clientX,
            touch.clientY
        );

    },
    { passive: true }
);

</script>

</body>
</html>
